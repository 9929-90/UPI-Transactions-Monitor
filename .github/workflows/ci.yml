name: UPI Pipeline CI

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-and-dashboard-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dashboard test dependencies
        run: python -m pip install --upgrade pip duckdb pytest
      - name: Check Python syntax
        run: python -m compileall -q src scripts dashboard tests
      - name: Test dashboard API helpers and threshold behavior
        run: python -m pytest tests/test_dashboard_api.py -v
